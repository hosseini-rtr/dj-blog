{% load i18n %}
<section class="services" id="services">
  <div class="section-inner">
    <p class="eyebrow mono-tag">{% trans "SYS.SERVICES / 06" %}</p>
    <h2 class="section-title" data-reveal>{% trans "How I can help" %}</h2>

    <div class="services__grid">
      {% for service in services %}
      <div class="service-card" data-reveal>
        <span class="service-card__glyph" aria-hidden="true">{{ service.glyph|default:"◆" }}</span>
        <h3>{{ service.title }}</h3>
        <p>{{ service.description }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
