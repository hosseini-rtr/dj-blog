{% load i18n %}
<section class="groups" id="groups">
  <div class="section-inner">
    <p class="eyebrow mono-tag">{% trans "SYS.EXPERIENCE / 04" %}</p>
    <h2 class="section-title" data-reveal>{% trans "Where I've built things" %}</h2>

    <div class="timeline">
      {% for group in groups %}
      <article class="timeline__item" data-reveal>
        <div class="timeline__marker">
          <span class="timeline__dot"></span>
          <span class="timeline__period mono-tag">{{ group.period }}</span>
        </div>
        <div class="timeline__content">
          <h3>{{ group.name }}</h3>
          <p class="timeline__role">{{ group.role }}</p>
          <p class="timeline__desc">{{ group.description }}</p>
          {% if group.tags %}
          <div class="tool-chips tool-chips--small">
            {% for tag in group.tags %}
            <span class="tool-chip">{{ tag }}</span>
            {% endfor %}
          </div>
          {% endif %}
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
